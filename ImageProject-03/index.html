<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"> </script>
  </head>
  <body>
    <a-scene>
     <a-assets>
      <img id="sky" src="assets/SKY.png"></img>
      <a-asset-item id="rocket" src="assets/Rocketship.glb"></a-asset-item>
      <a-asset-item id="station" src="assets/station.glb"></a-asset-item>
      <a-asset-item id="asteroid" src="assets/asteroid.glb"></a-asset-item>
      <img id="moon" src="assets/Moon_texture.jpg">
      </a-assets>
      
      <a-gltf-model scale="2 2 2" position="-6 10 -75" rotation="0 30 -35" color="#909090" src="#rocket"></a-gltf-model>
      <a-sky src="#sky" ></a-sky>
      
      <a-gltf-model scale="0.3 0.3 0.3" position="14 14 -30" rotation="20 30 10" src="#station"></a-gltf-model>


      <a-gltf-model scale="1 1 1" position="-14 20 -22" rotation="0 40 20" src="#asteroid"></a-gltf-model>
      <a-gltf-model scale="1.5 1.5 1.5" position="8 26 -28" rotation="30 0 60" src="#asteroid"></a-gltf-model>
      <a-gltf-model scale="0.7 0.7 0.7" position="24 18 -14" rotation="10 80 0" src="#asteroid"></a-gltf-model>
      <a-gltf-model scale="2 2 2" position="-26 30 -8" rotation="50 20 30" src="#asteroid"></a-gltf-model>
      <a-gltf-model scale="1.2 1.2 1.2" position="-10 34 14" rotation="0 120 45" src="#asteroid"></a-gltf-model>
      <a-gltf-model scale="0.9 0.9 0.9" position="18 22 18" rotation="70 10 0" src="#asteroid"></a-gltf-model>
      <a-gltf-model scale="2.5 2.5 2.5" position="0 40 -40" rotation="20 60 80" src="#asteroid"></a-gltf-model>
      
      
      <a-sphere a-sphere src="#moon" position="0 -80 0" radius="80" color="#909090"></a-sphere>

    </a-scene>
  </body>
</html>
