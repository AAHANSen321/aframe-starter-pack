<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
   <img id="sky" src="assets/sky.png">
   <img id="grass" src="assets/grass.png">
   <img id="waffle" src="assets/waffle.png">
  <img id="sand" src="assets/Sand.png">
   <img id="ball" src="assets/beachball.png"> 
      </a-assets>

      <a-sky src="#sky"></a-sky>
      <a-plane src="#grass" rotation="-90 0 0" width="30" height="30" repeat="10 10"></a-plane>

      <a-cone src="#waffle" position="-2 1 -4" radius-bottom="0" radius-top="0.4" height="1.2"></a-cone>
      <a-sphere color="pink" position="-2 1.9 -4" radius="0.45"></a-sphere>

      <a-box src="#sand" position="0 0.5 -5" width="2" height="1" depth="2"></a-box>
      <a-cylinder src="#sand" position="0 1.5 -5" radius="0.5" height="1"></a-cylinder>
      <a-cone src="#sand" position="0 2.4 -5" radius-bottom="0.6" radius-top="0" height="0.8"></a-cone>

      <a-sphere src="#ball" position="2 0.6 -4" radius="0.6"></a-sphere>
    </a-scene>
  </body>
</html>
