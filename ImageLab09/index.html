<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"> </script>
     <script src="https://unpkg.com/aframe-environment-component/dist/aframe-environment-component.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-entity id="snowman" position="0 0 -4">
       <a-sphere position="0 0.7 0" radius="0.7" color="#FFFFFF"></a-sphere>
  <a-sphere position="0 1.7 0" radius="0.5" color="#FFFFFF"></a-sphere>
  <a-sphere position="0 2.45 0" radius="0.35" color="#FFFFFF"></a-sphere>
  <a-cone position="0 2.45 0.45" rotation="90 0 0" radius-bottom="0.1" radius-top="0" height="0.5" color="#FF7F00"></a-cone>
  <a-sphere position="-0.12 2.55 0.3" radius="0.04" color="#000000"></a-sphere>
<a-sphere position="0.12 2.55 0.3" radius="0.04" color="#000000"></a-sphere>
      </a-entity>
      <!-- the enviroment entity includes a sky. Choose from the presets"none, default, contact, egypt, checkerboard, forest, goaland, yavapai, goldmine, threetowers, poison, arches, tron, japan, dream, volcano, starry, osiris, moon" -->
      <a-entity environment="preset: forest; dressingAmount: 300; dressingColor: #e8eef5; groundColor: #f4f4f4; groundColor2: #dfe6ee; skyType: gradient; skyColor: #a9c4e0; horizonColor: #e8eef5; fog: 0.5"></a-entity>
    </a-scene>
  </body>
</html>
